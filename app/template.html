<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>BoundBox</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: #ecece6; color: #1d1d1f; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #d9d9d2; flex: 0 0 auto; }
  header h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3b4bd8; font-weight: 600; }
  .project-status { display: inline-flex; align-items: center; gap: 5px; color: #6e6e66; font-size: 11px; white-space: nowrap; }
  #dirty-dot { color: #b45309; font-size: 15px; line-height: 0; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid #c9c9c1; border-radius: 7px; background: #fff; cursor: pointer; }
  button:hover { border-color: #8a8a80; }
  button.primary { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  button.danger { color: #b3261e; border-color: #e2b6b3; }
  main { flex: 1; display: flex; min-height: 0; }
  #workspace { flex: 1; overflow: auto; display: grid; place-items: center; padding: 24px; }
  #canvas { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.14), 0 8px 28px rgba(0,0,0,.08); }
  #background, #overlay { position: absolute; inset: 0; }
  #background { pointer-events: none; }
  #overlay { touch-action: none; cursor: crosshair; }
  aside { flex: 0 0 280px; background: #fff; border-left: 1px solid #d9d9d2; overflow-y: auto; padding: 12px 14px; font-size: 13px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8a80; margin: 16px 0 6px; }
  aside h2:first-child { margin-top: 2px; }
  aside label { display: block; color: #6e6e66; font-size: 11px; margin: 8px 0 2px; }
  aside input, aside textarea, aside select { font: inherit; font-size: 13px; width: 100%; padding: 5px 7px; border: 1px solid #d9d9d2; border-radius: 6px; background: #fff; }
  aside textarea { resize: vertical; min-height: 54px; }
  .rect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #empty-state { color: #8a8a80; padding: 10px 0; line-height: 1.5; }
  #box-count { color: #8a8a80; font-size: 11px; margin-top: 14px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 70vw; }
  #toast.show { opacity: 1; }
  .box-rect { fill: rgba(59, 75, 216, 0.08); stroke: #3b4bd8; stroke-width: 1.5; }
  .box-rect.type-text { fill: rgba(11, 128, 67, 0.08); stroke: #0b8043; }
  .box-rect.selected { stroke-width: 2; }
  .box-chip { font-size: 11px; font-weight: 600; fill: #fff; }
  .box-chip-bg { fill: #3b4bd8; rx: 3; }
  .box-chip-bg.type-text { fill: #0b8043; }
  .selection-outline { fill: none; stroke: #1d1d1f; stroke-dasharray: 4 3; stroke-width: 1; }
  .handle { fill: #fff; stroke: #1d1d1f; stroke-width: 1.25; }
  .preview { fill: rgba(29,29,31,0.05); stroke: #1d1d1f; stroke-dasharray: 5 4; stroke-width: 1.25; }
  .zoom-group { display: inline-flex; gap: 2px; }
  .zoom-group button { padding: 5px 8px; min-width: 34px; }
  #error-banner { display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: #fdecea; color: #8c1d18; border-bottom: 1px solid #e8b4b0; font-size: 13px; }
  #error-banner button { font-size: 12px; padding: 3px 9px; }
  .box-rect.bound { fill: rgba(124, 58, 237, 0.06); stroke: #7c3aed; }
  .box-chip-bg.bound { fill: #7c3aed; }
  .box-rect.deleted { fill: rgba(179, 38, 30, 0.06); stroke: #b3261e; stroke-dasharray: 4 3; }
  .box-chip-bg.deleted { fill: #b3261e; }
  .box-chip.deleted { text-decoration: line-through; }
  .ghost { fill: none; stroke: #9a9a90; stroke-dasharray: 3 3; stroke-width: 1; }
  #sprites { position: absolute; inset: 0; pointer-events: none; }
  #sprites .sprite { position: absolute; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.15); background: #fff; outline: 1px solid rgba(124, 58, 237, .4); }
  #bound-info { font-size: 11px; color: #7c3aed; background: #f5f0ff; border-radius: 5px; padding: 4px 7px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>BoundBox</h1>
  <span class="badge" id="mode-badge">Sketch</span>
  <span class="project-status" id="project-status" role="status" aria-live="polite" aria-atomic="true" title="Saved projects live at ./boundbox/project.json">
    <span id="dirty-dot" hidden aria-label="Unsaved changes">&bull;</span>
    <span id="project-name">New project</span>
    <span id="launcher-status" hidden> &middot; launcher offline</span>
  </span>
  <span class="spacer"></span>
  <span class="zoom-group">
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-fit" title="Fit to window">100%</button>
    <button id="zoom-in" title="Zoom in">+</button>
  </span>
  <button id="load-source" title="Load ./boundbox/source.wireloom as the background">Load wireframe</button>
  <button id="reload-source" hidden title="Re-read source.wireloom (pending edits are flushed)">Reload</button>
  <button id="clear-source" hidden>Clear</button>
  <button id="reset-workspace" title="Return to a blank canvas without deleting saved files or history">Reset workspace</button>
  <button id="open-project" title="Open ./boundbox/project.json">Open project</button>
  <button id="save-project" title="Save the complete session to ./boundbox/project.json">Save project</button>
  <button id="copy-json">Copy JSON</button>
  <button id="save" class="primary">Save for AI</button>
</header>
<div id="error-banner" role="alert" aria-live="assertive" hidden>
  <span id="error-text"></span>
  <button id="copy-error">Copy error for the AI</button>
  <button id="dismiss-error">Dismiss</button>
</div>
<main>
  <div id="workspace">
    <div id="canvas">
      <div id="background"></div>
      <div id="sprites"></div>
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <aside>
    <h2>Selected box</h2>
    <div id="empty-state">Drag on the canvas to create a box. Click a box to edit it here.</div>
    <div id="box-props" hidden>
      <div id="bound-info" hidden></div>
      <label for="prop-label">Label</label>
      <input id="prop-label" autocomplete="off">
      <div id="prop-desc-wrap">
        <label for="prop-desc">Describe what goes here</label>
        <textarea id="prop-desc" placeholder="e.g. Hero banner with product screenshot"></textarea>
      </div>
      <div id="prop-note-wrap" hidden>
        <label for="prop-note">Requested change (the AI reads this)</label>
        <textarea id="prop-note" placeholder="e.g. make this a tree instead of a list"></textarea>
      </div>
      <label for="prop-type">Type</label>
      <select id="prop-type"><option value="obj">Object</option><option value="text">Text</option></select>
      <div id="prop-text-wrap" hidden>
        <label for="prop-text">Literal text</label>
        <input id="prop-text" autocomplete="off" placeholder="The exact words to render">
      </div>
      <label>Position &amp; size</label>
      <div class="rect-grid">
        <input id="prop-x" type="number" title="X" aria-label="X">
        <input id="prop-y" type="number" title="Y" aria-label="Y">
        <input id="prop-w" type="number" title="Width" aria-label="Width">
        <input id="prop-h" type="number" title="Height" aria-label="Height">
      </div>
      <p style="margin:10px 0 0"><button id="delete-box" class="danger">Delete box</button></p>
    </div>

    <h2>Project context</h2>
    <label for="ctx-desc">Overall description</label>
    <textarea id="ctx-desc" placeholder="What is this whole layout?"></textarea>
    <label for="ctx-style">Style notes (optional)</label>
    <input id="ctx-style" autocomplete="off" placeholder="e.g. minimal, dark, playful">
    <label for="ctx-bg">Background (optional)</label>
    <input id="ctx-bg" autocomplete="off" placeholder="e.g. soft gradient, office scene">

    <h2>Canvas</h2>
    <div class="rect-grid">
      <input id="canvas-w" type="number" min="64" aria-label="Canvas width">
      <input id="canvas-h" type="number" min="64" aria-label="Canvas height">
    </div>
    <div id="box-count"></div>
  </aside>
</main>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
<!--APP_JS-->
</script>
</body>
</html>
